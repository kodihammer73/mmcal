org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation. Fixes a Windows "different roots"
# crash where plugin sources (in the C: pub cache) and the project (on D:)
# are on different drives, so Kotlin cannot build relative paths for its
# incremental caches. See: java.lang.IllegalArgumentException "this and base
# files have different roots". Trade-off: slightly slower Kotlin builds.
kotlin.incremental=false
